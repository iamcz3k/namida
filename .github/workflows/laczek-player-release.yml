name: LACZEK Player Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Create build signing key
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -storepass laczekplayer \
            -keypass laczekplayer \
            -alias laczek \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LaCzek, OU=LACZEK Player, O=LACZEK, L=Kampala, ST=Central, C=UG"

          cat > key.properties <<'EOF'
          storePassword=laczekplayer
          keyPassword=laczekplayer
          keyAlias=laczek
          storeFile=app/release-key.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        run: |
          set -e
          ls -lah build/app/outputs/flutter-apk/
          APK_COUNT=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | wc -l)
          test "$APK_COUNT" -gt 0

      - name: Prepare release files
        id: release
        shell: bash
        run: |
          set -e
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          VERSION_NAME="${VERSION%%+*}"
          TAG="v${VERSION}"
          mkdir -p release

          UNIVERSAL=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' ! -name '*arm64-v8a*' ! -name '*armeabi-v7a*' ! -name '*x86_64*' ! -name '*x86*' | head -n 1 || true)

          if [ -n "$UNIVERSAL" ]; then
            cp "$UNIVERSAL" "release/LACZEK-Player-v${VERSION_NAME}.apk"
          fi

          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              base=$(basename "$apk")
              cp "$apk" "release/$base"
            done

          test -n "$(find release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release files:"
          ls -lah release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: LACZEK Player ${{ steps.release.outputs.version_name }}
          make_latest: true
          prerelease: ${{ contains(steps.release.outputs.version, '-beta') }}
          generate_release_notes: true
          files: release/*.apk
