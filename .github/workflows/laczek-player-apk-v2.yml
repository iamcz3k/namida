name: LACZEK Player Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -e
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Read version
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION%%+*}" >> "$GITHUB_OUTPUT"

      - name: Prepare release
        run: |
          set -e
          mkdir -p release
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              cp "$apk" "release/LACZEK-Player-$(basename "$apk")"
            done
          ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-flutter
          name: LACZEK Player ${{ steps.version.outputs.version_name }} Flutter build
          make_latest: true
          prerelease: true
          generate_release_notes: true
          files: release/*.apk
