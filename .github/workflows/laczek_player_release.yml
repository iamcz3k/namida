name: LACZEK Player Release


on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone clean upstream Namida source
        run: git clone --depth 1 https://github.com/namidaco/namida.git build-src

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: config

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply LACZEK Player rebrand
        env:
          LACZEK_SOURCE: \${{ github.workspace }}/build-src
        run: python3 config/scripts/rebrand_laczek.py

      - name: Reuse checkout Git credentials for dependencies
        run: git -C config config --get-all http.https://github.com/.extraheader | while IFS= read -r h; do git config --global --add http.https://github.com/.extraheader "$h"; done
      - name: Fetch dependencies
        working-directory: build-src
        run: flutter pub get

      - name: Generate temporary release keystore
        working-directory: build-src
        run: |
          keytool -genkeypair -v -keystore laczek-release.jks -storepass laczek-build-only -keypass laczek-build-only -alias laczek -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=LACZEK, OU=LACZEK Player, O=LACZEK, C=UG"

      - name: Configure release signing
        working-directory: build-src
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=laczek-build-only
          keyPassword=laczek-build-only
          keyAlias=laczek
          storeFile=../laczek-release.jks
          EOF

      - name: Build universal release APK
        working-directory: build-src
        run: flutter build apk --release

      - name: Verify APK
        working-directory: build-src
        run: |
          test -f build/app/outputs/flutter-apk/LACZEKPlayer-1.0.0.apk
          apksigner verify --verbose build/app/outputs/flutter-apk/LACZEKPlayer-1.0.0.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: LACZEKPlayer-1.0.0
          path: build-src/build/app/outputs/flutter-apk/LACZEKPlayer-1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: LACZEK Player v1.0.0
          generate_release_notes: true
          files: build-src/build/app/outputs/flutter-apk/LACZEKPlayer-1.0.0.apk
